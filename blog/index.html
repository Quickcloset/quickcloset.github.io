  :root {
    --sage: #7C9468; --sage-deep: #5B7248; --sage-tint: #E4EBDC;
    --sand: #F1E9DC; --surface: #FBF7F0; --surface-alt: #E6DCC8;
    --text: #33291F; --text-2: #6F6152; --text-3: #A69885;
    --border: #DDD0BB; --ink: #211A13; --shadow: rgba(51, 41, 31, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sage: #9DB687; --sage-deep: #7C9468; --sage-tint: #33402A;
      --sand: #1A1510; --surface: #241E17; --surface-alt: #2D2519;
      --text: #F3ECE1; --text-2: #C7BBA9; --text-3: #8F8272;
      --border: #3B3226; --ink: #0F0C09; --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --sage: #9DB687; --sage-deep: #7C9468; --sage-tint: #33402A; --sand: #1A1510;
    --surface: #241E17; --surface-alt: #2D2519; --text: #F3ECE1; --text-2: #C7BBA9;
    --text-3: #8F8272; --border: #3B3226; --ink: #0F0C09; --shadow: rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    --sage: #7C9468; --sage-deep: #5B7248; --sage-tint: #E4EBDC; --sand: #F1E9DC;
    --surface: #FBF7F0; --surface-alt: #E6DCC8; --text: #33291F; --text-2: #6F6152;
    --text-3: #A69885; --border: #DDD0BB; --ink: #211A13; --shadow: rgba(51,41,31,0.12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--sand); color: var(--text); font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2 { font-family: 'Fraunces', serif; font-weight: 700; color: var(--text); text-wrap: balance; }

  nav {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--sand) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  }
  .nav-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; max-width: 720px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; text-decoration: none; color: var(--text); }
  .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--sage); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-mark svg { width: 15px; height: 15px; }
  .nav-back { font-size: 13px; font-weight: 700; color: var(--text-2); text-decoration: none; }
  .nav-back:hover { color: var(--sage-deep); }

  main { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
  .doc-eyebrow { font-size: 12px; font-weight: 700; color: var(--sage-deep); text-transform: uppercase; letter-spacing: 0.08em; }
  main h1 { font-size: clamp(30px, 4vw, 40px); margin: 8px 0 6px; }
  .doc-updated { font-size: 13px; color: var(--text-3); margin-bottom: 40px; display: block; }
  main h2 { font-size: 21px; margin: 40px 0 14px; }
  main p, main li { font-size: 15.5px; line-height: 1.7; color: var(--text-2); }
  main p { margin: 0 0 16px; }
  main ul { margin: 0 0 16px; padding-left: 22px; }
  main li { margin-bottom: 8px; }
  main strong { color: var(--text); }
  main a { color: var(--sage-deep); font-weight: 600; text-decoration: underline; text-decoration-color: var(--border); }
  .table-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--border); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; min-width: 480px; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; background: var(--surface-alt); }
  td { color: var(--text-2); }
  tr:last-child td { border-bottom: none; }

  footer { border-top: 1px solid var(--border); padding: 28px 24px; }
  .foot-row { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .foot-brand { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces'; font-weight: 700; font-size: 14px; color: var(--text-2); }
  .foot-note { font-size: 12px; color: var(--text-3); }

  .blog-card { display: block; padding: 20px 0; border-bottom: 1px solid var(--border); text-decoration: none; }
  .blog-card:last-child { border-bottom: none; }
  .blog-card-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; color: var(--text); margin: 0 0 8px; text-wrap: balance; }
  .blog-card-excerpt { font-size: 15px; line-height: 1.6; color: var(--text-2); margin: 0 0 8px; }
  .blog-card-date { font-size: 12px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

<script>
  var SUPABASE_URL = 'https://wyrvlotqsqztmatpwvih.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_y0QJd5N8GlKUX_EszjwFfA_ilIDpdl-';

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  }

  fetch(SUPABASE_URL + '/rest/v1/blog_posts?select=slug,title,excerpt,published_at&status=eq.published&order=published_at.desc', {
    headers: { apikey: SUPABASE_ANON_KEY },
  })
    .then(function (res) { return res.json(); })
    .then(function (posts) {
      var list = document.getElementById('blog-list');
      if (!posts || posts.length === 0) {
        list.innerHTML = '<p class="blog-empty">Nothing published yet — check back soon.</p>';
        return;
      }
      list.innerHTML = posts.map(function (p) {
        return '<a class="blog-card" href="/blog/post.html?slug=' + encodeURIComponent(p.slug) + '">' +
          '<div class="blog-card-date">' + fmtDate(p.published_at) + '</div>' +
          '<div class="blog-card-title">' + escapeHtml(p.title) + '</div>' +
          (p.excerpt ? '<div class="blog-card-excerpt">' + escapeHtml(p.excerpt) + '</div>' : '') +
          '</a>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('blog-list').innerHTML = '<p class="blog-empty">Could not load posts right now — try again shortly.</p>';
    });
</script>
